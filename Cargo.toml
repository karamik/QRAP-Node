[workspace]
members = [
    "crates/qrap-crypto",
    "crates/qrap-net",
    "crates/qrap-consensus",
    "crates/qrap-utxo",
    "crates/qrap-node",
]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha"
edition = "2021"
license = "MIT"
authors = ["TOTAL Protocol Team <team@totalprotocol.org>"]
repository = "https://github.com/karamik/QRAP-Node"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
sha3 = "0.10"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
bincode = "1.3"
chrono = "0.4"
rand = "0.8"
async-trait = "0.1"

# Internal crates
qrap-crypto = { path = "crates/qrap-crypto" }
qrap-net = { path = "crates/qrap-net" }
qrap-consensus = { path = "crates/qrap-consensus" }
qrap-utxo = { path = "crates/qrap-utxo" }
