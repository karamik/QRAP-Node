# QRAP PLONK kernel connectivity
# Maps kernel ports to DDR banks

[connectivity]
sp=krnl_ntt_1.inout:DDR[0]
sp=krnl_ntt_1.twiddles:DDR[1]
sp=krnl_msm_1.points:DDR[0]
sp=krnl_msm_1.scalars:DDR[1]
sp=krnl_msm_1.result:DDR[2]
sp=krnl_field_1.result:DDR[0]
sp=krnl_field_1.coeffs:DDR[1]

# Enable multi-bank access for bandwidth
[advanced]
param=compiler.enableAutoPipelining=false
param=compiler.xclDataflowFifoDepth=32

# Clocking
[clock]
freqHz=300000000:krnl_ntt_1
freqHz=250000000:krnl_msm_1
freqHz=300000000:krnl_field_1
