name: QRAP CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features mock,versal -- -D warnings
      # TODO: enable aws-f1 CI after resolving C++ stub compilation on ubuntu-latest
      # - run: cargo clippy --workspace --all-targets --features mock,aws-f1 -- -D warnings

  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: cargo test --workspace --features mock,versal
      # TODO: enable aws-f1 CI after resolving C++ stub compilation on ubuntu-latest
      # - run: cargo test -p qrap-fpga --features aws-f1

  test-simulators:
    name: Python Simulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 specs/coq/fee_splitter_check.py
          python3 specs/tla/orbital_bft_sim.py
          python3 specs/hardware/rad_calculator.py

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [lint, test-rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: qrap-release
          path: target/release/
